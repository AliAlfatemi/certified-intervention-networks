name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Smoke test
        run: python scripts/run_smoke_test.py
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel and bundled topology
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cin-wheel"
          "$RUNNER_TEMP/cin-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/cin-wheel/bin/python" -c "from cin.public_topologies import load_abilene_underlay; graph, _ = load_abilene_underlay(); assert graph.number_of_nodes() == 11"
